<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خطة الزيارات الميدانية — ٢٤ إلى ٣١ آب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f1f2f7;
    --ink:#1a1f3d;
    --ink-soft:#5a5f80;
    --line: rgba(28,32,77,0.12);
    --primary:#2b2f7e;       /* indigo - institutional */
    --primary-2:#3a3fa0;
    --gold:#3a3fa0;          /* route marker / accent — same family, no per-day shift */
    --card:#fbfbfd;

    /* single consistent accent for every category — identity stays the same across days */
    --accent: #2b2f7e;
    --accent-soft: #4145a8;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3, .display{
    font-family:'Cairo', sans-serif;
  }
  .num{
    font-family:'JetBrains Mono', monospace;
  }

  /* ---------- Header ---------- */
  header.hero{
    padding: 64px 24px 40px;
    max-width:960px;
    margin:0 auto;
    text-align:center;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:0.5px;
    color:var(--gold);
    background: rgba(184,134,46,0.1);
    border:1px solid rgba(184,134,46,0.35);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:22px;
  }
  header.hero h1{
    font-size:clamp(30px, 5vw, 48px);
    font-weight:900;
    margin:0 0 14px;
    color:var(--primary);
    line-height:1.25;
  }
  header.hero p{
    font-size:17px;
    color:var(--ink-soft);
    max-width:560px;
    margin:0 auto;
  }

  /* ---------- Sticky day nav ---------- */
  nav.daynav{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(242,241,236,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:10px 16px;
  }
  .daynav-inner{
    max-width:1040px;
    margin:0 auto;
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .daynav-inner::-webkit-scrollbar{display:none;}
  .daynav a{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:8px 16px;
    border-radius:12px;
    text-decoration:none;
    color:var(--ink-soft);
    border:1px solid transparent;
    transition: all .2s ease;
    font-size:13px;
  }
  .daynav a .d{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:16px;
    color:var(--ink);
  }
  .daynav a:hover{ background:var(--card); border-color:var(--line); }
  .daynav a.today{
    background:var(--primary);
    border-color:var(--primary);
  }
  .daynav a.today .d, .daynav a.today span:last-child{ color:#fff; }

  /* ---------- Route timeline ---------- */
  main{
    max-width:1040px;
    margin:0 auto;
    padding: 28px 20px 100px;
    position:relative;
  }
  main::before{
    /* the route line — signature element */
    content:"";
    position:absolute;
    top:10px; bottom:10px;
    right:38px;
    width:2px;
    background: repeating-linear-gradient(to bottom, var(--gold) 0 6px, transparent 6px 12px);
    opacity:0.55;
  }
  @media (max-width:640px){
    main::before{ right:20px; }
  }

  section.day{
    position:relative;
    padding-right:88px;
    margin-bottom:56px;
    scroll-margin-top:80px;
  }
  @media (max-width:640px){
    section.day{ padding-right:52px; }
  }

  .marker{
    position:absolute;
    right:22px;
    top:2px;
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--card);
    border:2px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13px;
    color:var(--primary);
  }
  @media (max-width:640px){
    .marker{ right:4px; width:28px; height:28px; font-size:11px;}
  }
  section.day.is-today .marker{
    background:var(--gold);
    color:#fff;
    border-color:var(--gold);
  }

  .day-head{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .day-head h2{
    font-size:22px;
    margin:0;
    color:var(--primary);
  }
  .day-head .weekday{
    font-size:14px;
    color:var(--ink-soft);
  }
  .badge-today{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    background:var(--gold);
    color:#fff;
    padding:3px 10px;
    border-radius:999px;
  }
  .location{
    font-size:15px;
    color:var(--ink-soft);
    margin:2px 0 18px;
  }
  .location strong{ color:var(--ink); font-weight:600; }

  .group{
    margin-bottom:18px;
  }
  .group-title{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:600;
    padding:5px 12px;
    border-radius:8px;
    margin-bottom:10px;
    color:#fff;
  }
  .group-title{ background:var(--accent); }

  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:10px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-size:14.5px;
    display:flex;
    align-items:center;
    gap:10px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(28,42,38,0.08);
  }
  .card .dot{
    width:8px; height:8px; border-radius:50%; flex:0 0 auto;
  }
  .card .dot{ background:var(--accent-soft); }

  .count-pill{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-inline-start:auto;
  }

  /* ---------- Footer ---------- */
  footer{
    text-align:center;
    padding:30px 20px 50px;
    color:var(--ink-soft);
    font-size:13px;
  }

  @media print{
    nav.daynav{ position:static; }
    main::before{ display:none; }
  }
</style>
</head>
<body>

<header class="hero">
  <span class="eyebrow">جدول الجولات الميدانية</span>
  <h1>خطة الزيارات الميدانية الأسبوعية</h1>
  <p>مسار الزيارات من ٢٤ إلى ٣١ آب، موزّع على ستة شوارع رئيسية في بغداد، حسب نوع النشاط التجاري في كل موقع.</p>
</header>

<nav class="daynav">
  <div class="daynav-inner" id="daynavInner"></div>
</nav>

<main id="mainContent"></main>

<footer>خطة داخلية للاستخدام الميداني — ٦ أيام زيارة، ٣٥ موقعًا</footer>

<script>
const DATA = [
  {
    date: 24, weekday: "الاثنين", street: "شارع الواثق",
    category: "مطاعم وكافيهات",
    groups: [
      { title: "الكافيهات", cls: "food", items: ["كافيه دو بيلفي (De Bellevue)", "كافيه دو بون (Bon Caffe)", "سبريسو كافيه (Spresso)", "وود كافيه (Wood Coffee)", "سينامون كافيه"] },
      { title: "المطاعم", cls: "food", items: ["مطعم زهر الليمون", "مطعم زرزور", "مطعم شاورما", "مطعم الدرويش", "مطعم السفير", "مطعم لوز"] }
    ]
  },
  {
    date: 25, weekday: "الثلاثاء", street: "شارع النضال",
    category: "شركات ومكاتب",
    groups: [
      { title: "شركات ومكاتب استثمارية وتجارية", cls: "office", items: ["شركة الأفق للمقاولات العامة", "شركة السندباد للسفر والسياحة", "شركة أور للخدمات والتجارة", "شركة بوابة العراق للتخليص الجمركي والنقل", "مكتب دجلة للاستشارات الهندسية", "شركة الفرات للاستثمار والتطوير العقاري"] }
    ]
  },
  {
    date: 26, weekday: "الأربعاء", street: "شارع الكفاح",
    category: "تجار ومحلات جملة",
    groups: [
      { title: "محلات وتجار الجملة", cls: "wholesale", items: ["معرض دجلة للكهربائيات (جملة)", "أسواق السلام للمواد البلاستيكية", "محلات النور لتجارة الأدوات المنزلية", "مجمع الأمانة للقرطاسية بالجملة", "محلات الرافدين للأجهزة الكهربائية"] }
    ]
  },
  {
    date: 29, weekday: "السبت", street: "الأمين / المشتل",
    category: "سوبرماركت ومواد غذائية",
    groups: [
      { title: "سوبرماركت ومواد غذائية", cls: "market", items: ["سوبرماركت الهلال", "سوبرماركت الخيرات", "أسواق العائلة", "أسواق البركة", "أسواق دجلة للمواد الغذائية", "أسواق الجيل الجديد"] }
    ]
  },
  {
    date: 30, weekday: "الأحد", street: "الأعظمية — شارع العصامي",
    category: "ملابس وأحذية",
    groups: [
      { title: "محلات ألبسة وأحذية", cls: "fashion", items: ["أزياء العصامي", "أزياء الشاهين", "أزياء الريم", "محلات خطوات للأحذية", "أزياء السعادة", "أزياء الأنيق", "مجمع العصامي التجاري"] }
    ]
  },
  {
    date: 31, weekday: "الاثنين", street: "الحارثية — شارع الحارثية التجاري",
    category: "شركات ومكاتب تجارية",
    groups: [
      { title: "الشركات التجارية والطبية", cls: "medical", items: ["شركة النخبة للتجهيزات والمستلزمات الطبية", "شركة البدر للاستيراد والتصدير", "شركة المدار للخدمات التجارية", "عمارة الحارثية التجارية (تضم مكاتب تجارية وشركات استيراد)", "شركة السدير للخدمات اللوجستية", "عمارة السلام التجارية"] }
    ]
  }
];

const TODAY = 24; // 24 August 2026

const navEl = document.getElementById('daynavInner');
const mainEl = document.getElementById('mainContent');

DATA.forEach((day, i) => {
  const id = 'day-' + day.date;
  const isToday = day.date === TODAY;

  // nav link
  const a = document.createElement('a');
  a.href = '#' + id;
  if (isToday) a.classList.add('today');
  a.innerHTML = `<span class="d">${day.date}</span><span>${day.street.split(' — ')[0].split(' / ')[0]}</span>`;
  navEl.appendChild(a);

  // section
  const sec = document.createElement('section');
  sec.className = 'day' + (isToday ? ' is-today' : '');
  sec.id = id;

  const totalCount = day.groups.reduce((s,g) => s + g.items.length, 0);

  let groupsHtml = day.groups.map(g => `
    <div class="group">
      <span class="group-title ${g.cls}">${g.title}</span>
      <div class="cards">
        ${g.items.map(it => `<div class="card"><span class="dot ${g.cls}"></span>${it}</div>`).join('')}
      </div>
    </div>
  `).join('');

  sec.innerHTML = `
    <div class="marker">${day.date}</div>
    <div class="day-head">
      <h2>${day.street}</h2>
      <span class="weekday">${day.weekday}، ${day.date} آب</span>
      ${isToday ? '<span class="badge-today">اليوم</span>' : ''}
    </div>
    <div class="location"><strong>${day.category}</strong> — ${totalCount} موقعًا مجدولاً</div>
    ${groupsHtml}
  `;

  mainEl.appendChild(sec);
});
</script>

</body>
</html>
